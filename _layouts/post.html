<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Automatically uses the title from your Markdown front matter -->
    <title>{{ page.title }} - Qianyang Chen</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
    <!-- Unified Header -->
    <header class="site-header">
        <div class="header-inner">
            <!-- Left Side: Title -->
            <div class="header-title">
                <h1 style="margin:0;">Qianyang Chen <span class="cn-name">(陳倩楊)</span></h1>
                <span class="pronunciation">Pronunciation: Chien-yahng Chen</span>
            </div>
            <!-- Right Side: Tabs -->
            <ul class="nav-links">
                <li><a href="{{ '/index.html' | relative_url }}">Home</a></li>
                <li><a href="{{ '/publications.html' | relative_url }}">Publications</a></li>
                <li><a href="{{ '/fun.html' | relative_url }}" class="active">Fun</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <main>
            <!-- This wraps Markdown post -->
            <article class="post-container">
                <h1 class="post-title">{{ page.title }}</h1>
                
                <div class="post-content">
                    {{ content }}
                </div>
            </article>

            <!-- Comments Section -->
            <hr style="margin-top: 60px; margin-bottom: 40px; border: 0; border-top: 1px solid var(--border-color);">
            <section class="comments-section">
                <h3 style="margin-bottom: 20px;">Share your thoughts</h3>
                
                <!-- Utterances Script: Update the repo name below! -->
                <script src="https://utteranc.es/client.js"
                        repo="qianyangchen/qianyangchen.github.io"
                        issue-term="pathname"
                        theme="github-light"
                        crossorigin="anonymous"
                        async>
                </script>
            </section>
        </main>
    </div>

    <!-- Minimalist Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>Last updated: October 2026</p>
        </div>
    </footer>
</body>
</html>
